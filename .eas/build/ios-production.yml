# Custom EAS Build config for iOS + tvOS (App Store), forcing bun.
#
# Shared by both the iPhone profile (production) and the tvOS profile
# (production_tv). The profile decides the rest:
#   - production_tv sets EXPO_TV=1 (env) so prebuild targets tvOS, and
#     credentialsSource: local (EAS can't manage tvOS creds remotely).
#   - production uses remote-managed iOS credentials.
#
# Like the Android configs, this replaces eas/install_node_modules and
# eas/prebuild (both auto-detect the wrong package manager) with explicit
# bun commands, and keeps EAS built-ins for credentials/version/fastlane.
build:
  name: iOS/tvOS App Store (bun)
  steps:
    - eas/checkout

    - run:
        name: Install dependencies (bun, frozen)
        command: bun install --frozen-lockfile

    # Resolves the job (credentials, version, update config) on the build
    # machine. EAS's own build runs it first; a build started from a workflow
    # gets no signing credentials without it, as only EAS CLI resolves the job
    # beforehand.
    - eas/resolve_build_config

    - eas/resolve_apple_team_id_from_credentials:
        id: resolve_team

    # The runtime version is the fingerprint of the source, computed here
    # before prebuild: the same hash the workflow's fingerprint job and every
    # update compute. app.config.ts pins the runtime version to it, so prebuild
    # writes it into Expo.plist as is. Left to the fingerprint policy, Xcode
    # hashed the prebuilt project instead (build 2: 941b9b0 for a 7d4d1de
    # source), and no update ever matched the build.
    - run:
        name: Pin runtime version to the source fingerprint
        command: |
          # The GitHub workflow (.github/workflows/fork-ios.yml) computes it
          # on the runner and hands it to the local build.
          if [ -n "$FORK_RUNTIME_VERSION" ]; then
            echo "Runtime version (from the runner): $FORK_RUNTIME_VERSION"
            exit 0
          fi
          HASH=$(bun x fingerprint fingerprint:generate --platform ios \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).hash))')
          if [ -z "$HASH" ]; then echo "Could not compute the fingerprint" >&2; exit 1; fi
          echo "Runtime version: $HASH"
          set-env FORK_RUNTIME_VERSION "$HASH"

    # android/ + ios/ are gitignored, so generate native code fresh.
    # EXPO_TV (from the profile env) selects iPhone vs tvOS. --no-install
    # skips JS + pod install; we install pods explicitly below with bun deps.
    - run:
        name: Prebuild (iOS/tvOS, bun)
        command: bun x expo prebuild --platform ios --no-install

    - run:
        name: Install CocoaPods
        working_directory: ./ios
        command: pod install

    # Writes the update channel (eas.json) and runtime version into the app's
    # Expo.plist, as EAS's default iOS build does after pod install. Without
    # it the build asks for updates under no channel and is never served one.
    - eas/configure_eas_update

    - eas/configure_ios_credentials
    - eas/configure_ios_version

    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }

    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
