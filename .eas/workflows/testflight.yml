# Fork-only: every push to `development` ships to my devices.
#
# - Native code unchanged (an EAS build with the same iOS fingerprint exists):
#   publish an over-the-air JS update to the `production` channel. Lands in a
#   few minutes; force-quit and reopen the app to get it.
# - Native code changed (or no build yet): full EAS build with the
#   `production` profile (custom bun steps in .eas/build/ios-production.yml,
#   remote credentials, remote auto-incremented build number), then upload to
#   TestFlight with the submit job.
#
# The fingerprint comes from fingerprint.config.js (upstream's, tuned for its
# own repack logic), and the app's runtimeVersion uses the same fingerprint, so
# an update can only ever reach a binary whose native code matches it.
#
# Run manually with `eas workflow:run .eas/workflows/testflight.yml`; pass
# `-F full_build=true` to force a native build. See FORK.md.
name: Ship development

# Manual-only since the move to GitHub Actions (.github/workflows/fork-ios.yml):
# the free plan's 60 CI minutes a month ran out.
on:
  workflow_dispatch:
    inputs:
      full_build:
        type: boolean
        default: false
        description: Build and upload to TestFlight even if native code is unchanged

jobs:
  fingerprint:
    name: Native fingerprint
    type: fingerprint
    environment: production

  get_build:
    name: Find matching build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # A build still running from an earlier push counts: publish onto it
      # instead of starting a second identical build.
      wait_for_in_progress: true

  publish_update:
    name: Publish JS update
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id && !inputs.full_build }}
    type: update
    environment: production
    params:
      platform: ios
      channel: production
      # No Sentry org for the fork.
      upload_sentry_sourcemaps: false

  # The build config's eas/resolve_build_config step resolves the job's
  # signing credentials on the build machine; without it a build started
  # here had none (see .eas/build/ios-production.yml).
  build_ios:
    name: Build iOS
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id || inputs.full_build }}
    type: build
    params:
      platform: ios
      profile: production

  # The submit job, not the testflight one: on the free plan a testflight job
  # cannot take an EAS build (only an App Store Connect build), and the
  # submit job uploads to TestFlight just the same, minus "What to Test".
  submit_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
