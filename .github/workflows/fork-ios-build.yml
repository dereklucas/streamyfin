# Fork-only: the iOS and tvOS builds, called by fork-ios.yml (once, and again
# when an attempt is cancelled before any runner took it). See FORK.md.
#
# One job builds both, iOS first, never two at once: EAS keeps one App Store
# provisioning profile per bundle identifier whatever the platform, so each
# build swaps the stored profile for its own (made with the App Store Connect
# API key on EAS). A failed tvOS build leaves the iOS one shipped.
name: "🍎 Fork: build iOS and tvOS"

on:
  workflow_call:
    inputs:
      fingerprint:
        description: The iOS native fingerprint, also its runtime version
        type: string
        required: true
      tv_fingerprint:
        description: The tvOS native fingerprint, also its runtime version
        type: string
        required: true
      build_ios:
        type: boolean
        default: true
      build_tvos:
        type: boolean
        default: false
    secrets:
      EXPO_TOKEN:
        required: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_CLI: eas-cli@latest

jobs:
  build:
    name: Build and upload to TestFlight
    # macos-26: only its Xcode compiles expo-modules-jsi (macos-15's Xcode
    # 26.3 rejects it as a data race). Its runners are scarce: a job no runner
    # takes within ~15 min is cancelled unstarted, so fork-ios.yml retries.
    runs-on: macos-26
    timeout-minutes: 200
    env:
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/build-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the notes

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Tools
        run: |
          xcodebuild -version
          pod --version || sudo gem install cocoapods
          fastlane --version || brew install fastlane

      # What changed since the last shipped build, baked into the app for the
      # Developer screen. (TestFlight's "What to Test" cannot be set: eas
      # submit's changelog is for EAS Enterprise plans only.)
      # The production profile's custom steps (.eas/build/ios-production.yml)
      # run here as they do on EAS; the runtime version comes from the env.
      - name: Build iOS
        if: inputs.build_ios
        env:
          FORK_RUNTIME_VERSION: ${{ inputs.fingerprint }}
        run: |
          BUILD_NOTES=$(bash scripts/fork/build-notes.sh)
          echo "$BUILD_NOTES"
          export BUILD_NOTES
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          bun x "$EAS_CLI" build --platform ios --profile production --local \
            --non-interactive --output "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/app.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.build_ios
        with:
          name: streamyfin-ios-${{ inputs.fingerprint }}
          path: build-output/app.ipa
          retention-days: 14

      - name: Upload iOS to TestFlight
        if: inputs.build_ios
        run: |
          bun x "$EAS_CLI" submit --platform ios --profile production \
            --path "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/app.ipa" \
            --non-interactive --wait

      - name: Record the shipped iOS build
        if: inputs.build_ios
        env:
          HASH: ${{ inputs.fingerprint }}
        run: |
          git tag -f "ios-build/$HASH" "$GITHUB_SHA"
          git push -f origin "refs/tags/ios-build/$HASH"

      # The production profile again, with EXPO_TV=1 from the environment:
      # prebuild makes the tvOS project and its Top Shelf extension, and
      # eas-cli reads it too, signing with a tvOS App Store profile it makes
      # in place of the iOS one. (Not a profile of its own: eas.json is part
      # of the native fingerprint, and a new profile rebuilt iOS.)
      # Making the tvOS profiles signs in to Apple with the App Store Connect
      # key stored on EAS, which also needs the team ID: without it eas-cli
      # asks for one, and a non-interactive build fails. It is the team of the
      # app's iOS credentials on EAS.
      - name: Apple team
        if: inputs.build_tvos
        run: |
          PROJECT_ID=$(jq -r .expo.extra.eas.projectId app.json)
          QUERY='query($id: String!) { app { byId(appId: $id) { iosAppCredentials { appleTeam { appleTeamIdentifier } } } } }'
          TEAM=$(jq -n --arg q "$QUERY" --arg id "$PROJECT_ID" '{query: $q, variables: {id: $id}}' \
            | curl -sS https://api.expo.dev/graphql \
                -H "Authorization: Bearer $EXPO_TOKEN" -H "Content-Type: application/json" -d @- \
            | jq -r '[.data.app.byId.iosAppCredentials[]?.appleTeam.appleTeamIdentifier // empty][0] // empty')
          if [ -z "$TEAM" ]; then echo "No Apple team in the app's EAS credentials" >&2; exit 1; fi
          echo "Apple team: $TEAM"
          echo "EXPO_APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      - name: Build tvOS
        if: inputs.build_tvos
        env:
          EXPO_TV: "1"
          FORK_RUNTIME_VERSION: ${{ inputs.tv_fingerprint }}
        run: |
          BUILD_NOTES=$(bash scripts/fork/build-notes.sh "" tvos-build)
          echo "$BUILD_NOTES"
          export BUILD_NOTES
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          bun x "$EAS_CLI" build --platform ios --profile production --local \
            --non-interactive --output "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/tv.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.build_tvos
        with:
          name: streamyfin-tvos-${{ inputs.tv_fingerprint }}
          path: build-output/tv.ipa
          retention-days: 14

      # The same App Store Connect app: Apple files it under tvOS.
      - name: Upload tvOS to TestFlight
        if: inputs.build_tvos
        run: |
          bun x "$EAS_CLI" submit --platform ios --profile production \
            --path "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/tv.ipa" \
            --non-interactive --wait

      - name: Record the shipped tvOS build
        if: inputs.build_tvos
        env:
          HASH: ${{ inputs.tv_fingerprint }}
        run: |
          git tag -f "tvos-build/$HASH" "$GITHUB_SHA"
          git push -f origin "refs/tags/tvos-build/$HASH"
