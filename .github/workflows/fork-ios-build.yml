# Fork-only: the iOS build, called by fork-ios.yml (once, and again when an
# attempt is cancelled before any runner took it). See FORK.md.
name: "🍎 Fork: build iOS"

on:
  workflow_call:
    inputs:
      fingerprint:
        description: The native fingerprint, also the runtime version
        type: string
        required: true
    secrets:
      EXPO_TOKEN:
        required: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_CLI: eas-cli@latest

jobs:
  build:
    name: Build iOS and upload to TestFlight
    # macos-26: only its Xcode compiles expo-modules-jsi (macos-15's Xcode
    # 26.3 rejects it as a data race). Its runners are scarce: a job no runner
    # takes within ~15 min is cancelled unstarted, so fork-ios.yml retries.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      FORK_RUNTIME_VERSION: ${{ inputs.fingerprint }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/build-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the notes

      # What changed since the last shipped build: baked into the app for the
      # Developer screen, and TestFlight's "What to Test", with the branch.
      - name: Notes
        run: |
          notes=$(bash scripts/fork/build-notes.sh)
          echo "$notes"
          { echo "BUILD_NOTES<<FORK_NOTES_END"; echo "$notes"; echo "FORK_NOTES_END"; } >> "$GITHUB_ENV"
          what="Branch: $GITHUB_REF_NAME (${GITHUB_SHA:0:7})"
          if [ -n "$notes" ]; then
            what="$what"$'\n\n'"Changes since the last build:"$'\n'"$(echo "$notes" | sed 's/^/• /')"
          fi
          # TestFlight takes at most 4000 characters.
          what="${what:0:3900}"
          { echo "WHAT_TO_TEST<<FORK_NOTES_END"; echo "$what"; echo "FORK_NOTES_END"; } >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Tools
        run: |
          xcodebuild -version
          pod --version || sudo gem install cocoapods
          fastlane --version || brew install fastlane

      # The production profile's custom steps (.eas/build/ios-production.yml)
      # run here as they do on EAS; the runtime version comes from the env.
      - name: Build
        run: |
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          bun x "$EAS_CLI" build --platform ios --profile production --local \
            --non-interactive --output "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/app.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamyfin-ios-${{ inputs.fingerprint }}
          path: build-output/app.ipa
          retention-days: 14

      - name: Upload to TestFlight
        run: |
          bun x "$EAS_CLI" submit --platform ios --profile production \
            --path "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/app.ipa" \
            --what-to-test "$WHAT_TO_TEST" --non-interactive --wait

      - name: Record the shipped build
        env:
          HASH: ${{ inputs.fingerprint }}
        run: |
          git tag -f "ios-build/$HASH" "$GITHUB_SHA"
          git push -f origin "refs/tags/ios-build/$HASH"
