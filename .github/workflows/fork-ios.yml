# Fork-only (dereklucas/streamyfin): ships iOS from GitHub Actions, which is
# free without a minute limit for a public repository, macOS runners included.
# Replaces the EAS workflows in .eas/workflows/ (now manual-only), whose free
# plan allows 60 CI minutes a month. See FORK.md.
#
# - Push to `development`: if a build with the same native fingerprint has
#   shipped, publish an over-the-air JS update to the `production` channel;
#   otherwise build on a macOS runner (`eas build --local`, Expo-managed
#   signing, remote build number) and upload to TestFlight (`eas submit`).
# - Push to fix/* or feat/*: publish a JS update to a channel named after the
#   branch (More → Developer can follow it), only when its native code matches
#   a shipped build. A push to a branch never builds.
# - Push to build/*: builds that branch when no shipped build has its native
#   code, for testing native work from TestFlight before it is merged (a
#   session's GitHub access cannot start a run by hand). Its JS updates go to
#   a channel named after the branch, like fix/* and feat/*.
# - Run by hand (Actions → Run workflow) on any branch: builds that branch
#   when no shipped build has its native code (or "full build" is ticked),
#   for testing native work before it is merged. The build goes to TestFlight
#   like any other; follow the branch from More → Developer for its updates.
#
# Every build and update carries the commits since the build it is made on
# (scripts/fork/build-notes.sh): the Developer screen's "What to test", and
# for a build TestFlight's "What to Test", with the branch and commit.
#
# A shipped build is recorded as the tag `ios-build/<fingerprint>` (local
# builds do not show up in EAS's build list). Builds made by EAS before the
# move are found through EAS as well.
#
# Needs the repository secret EXPO_TOKEN (an Expo robot token for the
# dereklucas account).
name: "🍎 Fork: ship iOS"

on:
  push:
    branches: [development, "fix/**", "feat/**", "build/**"]
  workflow_dispatch:
    inputs:
      full_build:
        description: Build and upload to TestFlight even if native code is unchanged
        type: boolean
        default: false

# A newer push supersedes a run in progress on the same branch: if it cancels
# a build, the newer run finds no shipped build and builds itself.
concurrency:
  group: fork-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the ios-build/<fingerprint> tag

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_CLI: eas-cli@latest

jobs:
  decide:
    name: Native fingerprint
    if: github.repository == 'dereklucas/streamyfin'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
      shipped: ${{ steps.shipped.outputs.shipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Fingerprint the native code
        id: fingerprint
        run: |
          HASH=$(bun x fingerprint fingerprint:generate --platform ios | jq -r .hash)
          if [ -z "$HASH" ] || [ "$HASH" = null ]; then echo "No fingerprint" >&2; exit 1; fi
          echo "iOS fingerprint: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Look for a shipped build with it
        id: shipped
        env:
          HASH: ${{ steps.fingerprint.outputs.hash }}
        run: |
          if git rev-parse -q --verify "refs/tags/ios-build/$HASH" >/dev/null; then
            echo "Shipped: tag ios-build/$HASH"
            echo "shipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(bun x "$EAS_CLI" build:list --platform ios --status finished \
            --fingerprint-hash "$HASH" --limit 1 --json --non-interactive 2>/dev/null \
            | jq 'length' || echo 0)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "Shipped: an EAS build has this fingerprint"
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build has this fingerprint yet"
            echo "shipped=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: Publish JS update
    needs: decide
    if: needs.decide.outputs.shipped == 'true' && !inputs.full_build
    runs-on: ubuntu-latest
    env:
      FORK_RUNTIME_VERSION: ${{ needs.decide.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the notes

      # What changed since the build this update runs on, baked into the
      # update (app.config.ts → the Developer screen's "What to test").
      - name: Notes
        env:
          HASH: ${{ needs.decide.outputs.fingerprint }}
        run: |
          notes=$(bash scripts/fork/build-notes.sh "ios-build/$HASH")
          echo "$notes"
          { echo "BUILD_NOTES<<FORK_NOTES_END"; echo "$notes"; echo "FORK_NOTES_END"; } >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Make sure the branch has an update channel
        if: github.ref_name != 'development'
        # The app follows a branch by its channel name; channel:create also
        # creates the update branch. It fails once the channel exists.
        run: |
          bun x "$EAS_CLI" channel:create "$GITHUB_REF_NAME" --non-interactive \
            || echo "Channel $GITHUB_REF_NAME already exists."

      - name: Publish
        env:
          UPDATE_BRANCH: ${{ github.ref_name == 'development' && 'production' || github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          bun x "$EAS_CLI" update --branch "$UPDATE_BRANCH" --platform ios \
            --environment production --message "$(echo "$MESSAGE" | head -1)" \
            --non-interactive

  build:
    name: Build iOS and upload to TestFlight
    needs: decide
    if: (github.ref_name == 'development' || startsWith(github.ref_name, 'build/') || github.event_name == 'workflow_dispatch') && (needs.decide.outputs.shipped != 'true' || inputs.full_build)
    # macos-15, not macos-26: macos-26 runners were scarce enough that jobs
    # waited past GitHub's ~15 min limit and were cancelled unstarted. The
    # macos-15 image carries Xcode 26.x, which latest-stable selects.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FORK_RUNTIME_VERSION: ${{ needs.decide.outputs.fingerprint }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/build-output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the notes

      # What changed since the last shipped build: baked into the app for the
      # Developer screen, and TestFlight's "What to Test", with the branch.
      - name: Notes
        run: |
          notes=$(bash scripts/fork/build-notes.sh)
          echo "$notes"
          { echo "BUILD_NOTES<<FORK_NOTES_END"; echo "$notes"; echo "FORK_NOTES_END"; } >> "$GITHUB_ENV"
          what="Branch: $GITHUB_REF_NAME (${GITHUB_SHA:0:7})"
          if [ -n "$notes" ]; then
            what="$what"$'\n\n'"Changes since the last build:"$'\n'"$(echo "$notes" | sed 's/^/• /')"
          fi
          # TestFlight takes at most 4000 characters.
          what="${what:0:3900}"
          { echo "WHAT_TO_TEST<<FORK_NOTES_END"; echo "$what"; echo "FORK_NOTES_END"; } >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Tools
        run: |
          xcodebuild -version
          pod --version || sudo gem install cocoapods
          fastlane --version || brew install fastlane

      # The production profile's custom steps (.eas/build/ios-production.yml)
      # run here as they do on EAS; the runtime version comes from the env.
      - name: Build
        run: |
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          bun x "$EAS_CLI" build --platform ios --profile production --local \
            --non-interactive --output "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/app.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamyfin-ios-${{ needs.decide.outputs.fingerprint }}
          path: build-output/app.ipa
          retention-days: 14

      - name: Upload to TestFlight
        run: |
          bun x "$EAS_CLI" submit --platform ios --profile production \
            --path "$EAS_LOCAL_BUILD_ARTIFACTS_DIR/app.ipa" \
            --what-to-test "$WHAT_TO_TEST" --non-interactive --wait

      - name: Record the shipped build
        env:
          HASH: ${{ needs.decide.outputs.fingerprint }}
        run: |
          git tag -f "ios-build/$HASH" "$GITHUB_SHA"
          git push -f origin "refs/tags/ios-build/$HASH"
